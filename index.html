<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>库存日报看板 - TikTok Shop</title>
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --primary:#4f46e5; --primary-soft:#eef2ff; --danger:#ef4444; --danger-soft:#fef2f2;
    --warn:#f59e0b; --warn-soft:#fffbeb; --ok:#10b981; --ok-soft:#ecfdf5;
    --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --shadow-lg:0 10px 30px -10px rgba(16,24,40,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding:24px 20px 60px;
    overflow-x:hidden}
  .wrap{max-width:1240px;width:100%;margin:0 auto;min-width:0}

  .head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px}
  .head .tit{display:flex;align-items:center;gap:12px}
  .head h1{font-size:22px;font-weight:700;letter-spacing:.2px}
  .head .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#7c3aed);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:var(--shadow-lg)}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .btn{cursor:pointer;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;
    background:var(--primary);color:#fff;transition:.15s;box-shadow:var(--shadow)}
  .btn:hover{background:#4338ca;transform:translateY(-1px)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f9fafb}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px}
  .kpis>*{min-width:0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
  .kpi .ic{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:18px}
  .kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:500}
  .kpi .val{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
  .kpi .foot{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
  .delta{font-weight:700}
  .delta.neg{color:var(--danger)} .delta.pos{color:var(--ok)} .delta.zero{color:var(--muted)}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;margin-bottom:16px}
  .grid2>*,.grid3>*{min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px 20px;min-width:0}
  .card h2{font-size:14.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h2 .n{color:var(--muted);font-weight:500;font-size:12.5px}

  .whbar{margin:10px 0}
  .whbar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .whbar .nm{font-weight:600}
  .whbar .vs{color:var(--muted)}
  .track{height:26px;background:#f3f4f6;border-radius:7px;overflow:hidden}
  .fill{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:9px;color:#fff;font-size:12px;font-weight:700;transition:width .8s cubic-bezier(.4,0,.2,1)}
  .whbar .sub{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:4px}
  .whbar .sub b{color:var(--ink)}

  .donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .donut{position:relative;width:130px;height:130px}
  .donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut .center .n{font-size:24px;font-weight:800}
  .donut .center .t{font-size:11px;color:var(--muted)}
  .legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:120px}
  .legend .row{display:flex;align-items:center;justify-content:space-between;font-size:13px;gap:10px}
  .legend .l{display:flex;align-items:center;gap:8px}
  .legend .sq{width:11px;height:11px;border-radius:3px}
  .legend .num{font-weight:700}

  .alert-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .alert-box{border-radius:11px;padding:14px 16px;border:1px solid}
  .alert-box.out{background:var(--danger-soft);border-color:#fecaca}
  .alert-box.low{background:var(--warn-soft);border-color:#fde68a}
  .alert-box .ht{font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .alert-box.out .ht{color:#b91c1c} .alert-box.low .ht{color:#b45309}
  .alert-box .cnt{background:rgba(255,255,255,.7);border-radius:999px;padding:2px 9px;font-size:12px}
  .alert-list{display:flex;flex-direction:column;gap:7px;max-height:200px;overflow:auto}
  .alert-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.6);
    border-radius:8px;padding:7px 11px;font-size:12.5px}
  .alert-item .wn{color:var(--muted);font-size:11px}
  .alert-item .qn{font-weight:700}
  .empty-note{font-size:12.5px;color:var(--muted);padding:4px 2px}

  .wh-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .wh-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fafbff,#fff)}
  .wh-head .lt{display:flex;align-items:center;gap:9px}
  .wh-head .code{font-size:11px;font-weight:700;background:var(--primary-soft);color:var(--primary);
    padding:3px 8px;border-radius:6px}
  .wh-head .nm{font-weight:700;font-size:14.5px}
  .wh-head .rt{font-size:12px;color:var(--muted)}
  .wh-head .rt b{color:var(--ink)}
  .tbl-wrap{overflow:auto;max-height:420px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 16px;text-align:left;white-space:nowrap}
  thead th{position:sticky;top:0;background:#f9fafb;font-weight:600;color:var(--muted);font-size:12px;
    border-bottom:1px solid var(--line);z-index:1}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr:hover{background:#f9fafb}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .badge.out{background:var(--danger-soft);color:#b91c1c}
  .badge.low{background:var(--warn-soft);color:#b45309}
  .badge.ok{background:var(--ok-soft);color:#047857}
  .bar-mini{width:60px;height:6px;background:#eef0f3;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
  .bar-mini i{display:block;height:100%;border-radius:3px}

  .toolbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .search{flex:1;min-width:180px;position:relative}
  .search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none}
  .search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .chip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);cursor:pointer;
    background:#fff;font-weight:600;color:var(--muted);transition:.15s}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .chip:hover:not(.active){border-color:#cbd5e1}

  .matrix-wrap{overflow:auto;max-height:520px}

  .data-panel{margin-top:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
    box-shadow:var(--shadow);overflow:hidden}
  .dp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;
    background:linear-gradient(180deg,#fafbff,#fff)}
  .dp-head .lt{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
  .dp-head .lt .hint{font-weight:500;color:var(--muted);font-size:12.5px}
  .dp-head .chev{transition:.25s;color:var(--muted)}
  .data-panel.open .chev{transform:rotate(180deg)}
  .dp-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .data-panel.open .dp-body{max-height:1400px}
  .dp-inner{padding:16px 18px;border-top:1px solid var(--line)}
  .dp-inner textarea{width:100%;height:230px;font-family:"Consolas","SF Mono",Menlo,monospace;font-size:12.5px;
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;resize:vertical;outline:none;line-height:1.6}
  .dp-inner textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .dp-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .dp-status{font-size:12.5px;color:var(--muted);margin-left:auto}
  .dp-status.ok{color:var(--ok)} .dp-status.err{color:var(--danger)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:#1f2937;color:#fff;
    padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);transition:.3s;z-index:50}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .sec{margin-bottom:16px}
  .nores{padding:30px;text-align:center;color:var(--muted);font-size:13px}

  .cat-summary{padding:11px 18px;border-top:1px solid var(--line);background:#fafbff;
    font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cat-summary .ctit{font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
  .cat-summary .ci{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:#fff;
    border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink)}
  .cat-summary .ci b{font-weight:700;color:var(--primary)}
  .cat-summary .ci em{font-style:normal;color:var(--muted);font-weight:500}
  .cat-summary .ci.out b{color:#dc2626}
  .cat-summary .ci.low b{color:#b45309}
  .cat-empty{color:var(--muted);font-size:12px;padding:2px 4px}

  .cat-matrix-row{cursor:pointer}
  .cat-matrix-row:hover{background:#f9fafb}
  .cat-sub{font-size:11px;color:var(--muted);font-weight:500}
  .cat-wh-cell{text-align:right;font-variant-numeric:tabular-nums}
  .cat-wh-cell .lo{color:#b45309;font-weight:600}
  .cat-wh-cell .ot{color:#dc2626;font-weight:700}
  @media(max-width:520px){
    body{padding:18px 12px 40px}
    .kpi .val{font-size:26px}
    .head h1{font-size:19px}
    .head .sub{font-size:12px}
  }
</style>
</head>

<noscript><div style="padding:20px;background:#fee2e2;color:#991b1b;text-align:center;font-weight:600;">请启用 JavaScript 以使用库存日报看板。</div></noscript>
<div class="wrap">
  <div class="head">
    <div class="tit">
      <div class="logo">📦</div>
      <div>
        <h1>库存日报看板</h1>
        <div class="sub" id="hd-sub">TikTok Shop 多仓库存监控 · 实时预警</div>
      </div>
    </div>
    <div class="meta">
      <span class="pill"><span class="dot"></span><span id="hd-date">—</span></span>
      <span class="pill" id="hd-update">—</span>
      <button class="btn ghost" id="btn-export">导出 JSON</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <div class="card">
      <h2>各仓库库存总量 <span class="n">按件数</span></h2>
      <div id="wh-chart"></div>
    </div>
    <div class="card">
      <h2>库存健康度 <span class="n">按SKU数</span></h2>
      <div class="donut-wrap" id="health"></div>
    </div>
  </div>

  <div class="card sec">
    <h2>库存预警 <span class="n">需关注</span></h2>
    <div class="alert-grid" id="alerts"></div>
  </div>

  <div class="sec">
    <div class="toolbar">
      <div class="search">
        <span class="si">🔍</span>
        <input id="search" type="text" placeholder="搜索SKU名称（跨所有仓库）...">
      </div>
      <div id="chips"></div>
    </div>
    <div id="wh-tables"></div>
  </div>

  <div class="card sec" id="cat-section">
    <h2>全仓类目统计 <span class="n">按品类聚合 · 共<span id="cat-total">0</span>个类目</span></h2>
    <div class="matrix-wrap">
      <table id="cat-matrix">
        <thead><tr>
          <th>类目</th>
          <th class="num">总库存</th>
          <th class="num">SKU数</th>
          <th class="num" id="cat-th-0">仓1</th>
          <th class="num" id="cat-th-1">仓2</th>
          <th class="num" id="cat-th-2">仓3</th>
          <th class="num">货值</th>
          <th>状态</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="card sec">
    <h2>跨仓SKU汇总 <span class="n">同一SKU在不同仓库的分布</span></h2>
    <div class="matrix-wrap">
      <table id="matrix">
        <thead><tr><th>SKU名称</th><th class="num">总库存</th><th class="num">覆盖仓数</th><th>分布</th><th>状态</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="data-panel" id="data-panel">
    <div class="dp-head" id="dp-toggle">
      <div class="lt">⚙️ 数据更新 <span class="hint">粘贴日报文本即可自动刷新看板</span></div>
      <span class="chev">▾</span>
    </div>
    <div class="dp-body">
      <div class="dp-inner">
        <textarea id="raw-input" placeholder="在此粘贴完整日报文本（格式：📦 X月X日库存日报 … 【仓码 仓名】N个SKU，N件 … N. SKU名：N件 ⚠️断货/低库存 …  总计：…）"></textarea>
        <div class="dp-actions">
          <button class="btn" id="btn-update">更新看板</button>
          <button class="btn ghost" id="btn-load">载入示例</button>
          <span class="dp-status" id="dp-status"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ============ 解析器 ============ */
function parseInput(text){
  const m = {date:'', warehouses:[], total:{skuCount:0,itemCount:0,dailyChange:null}};

  /* ---- JSON格式兼容 ---- */
  try{
    const j = JSON.parse(text);
    if(j && j.items && Array.isArray(j.items)){
      const WH_NAMES = {'MY-02':'马来仓','PH-08':'菲律宾仓','TH-08':'泰国仓'};
      const whMap = {};
      j.items.forEach(it=>{
        const wh = it.warehouse || '';
        if(!whMap[wh]) whMap[wh] = {code:wh, name:WH_NAMES[wh]||wh, skuCount:0, itemCount:0, items:[]};
        const w = whMap[wh];
        const qty = it.available != null ? it.available : 0;
        let alert = null;
        if(qty <= 0) alert = '断货';
        else if(qty <= 20) alert = '低库存';
        w.items.push({name:it.cnName||it.sku||'', qty, alert});
        w.skuCount++;
        w.itemCount += qty;
      });
      const whOrder = ['MY-02','PH-08','TH-08'];
      m.warehouses = whOrder.filter(c=>whMap[c]).map(c=>whMap[c]);
      Object.keys(whMap).filter(c=>!whOrder.includes(c)).forEach(c=>m.warehouses.push(whMap[c]));
      if(j.summary){
        m.total.skuCount = j.summary.totalSKU || 0;
        m.total.itemCount = j.summary.totalAvailable || 0;
        m.total.dailyChange = j.summary.dayChange != null ? j.summary.dayChange : null;
      }
      if(j.date){
        const ds = String(j.date);
        if(ds.length===8) m.date = ds.slice(0,4)+'/'+ds.slice(4,6)+'/'+ds.slice(6,8);
        else m.date = ds;
      }
      /* 成本货值计算 */
      m.total.costValue = 0;
      m.warehouses.forEach(w=>{
        w.costValue = 0;
        w.items.forEach(i=>{
          i.unitPrice = getUnitPrice(i.name);
          i.costValue = i.qty * i.unitPrice;
          w.costValue += i.costValue;
        });
        m.total.costValue += w.costValue;
      });
      return m;
    }
  }catch(e){}

  const dM = text.match(/(\d{1,2})月(\d{1,2})日/);
  if(dM) m.date = `${dM[1]}月${dM[2]}日`;

  const tM = text.match(/总计[：:]\s*(\d+)\s*个\s*SKU[，, \|]+\D*(\d+)\s*[件个]/);
  if(tM){
    m.total.skuCount = +tM[1];
    m.total.itemCount = +tM[2];
  }
  const dcM = text.match(/日环比\s*([+-]?\d+)\s*件/);
  if(dcM) m.total.dailyChange = +dcM[1];

  const lines = text.split(/\r?\n/);
  let cur = null;
  const whRe = /【\s*([^\s】]+)\s+([^】]+?)\s*】\s*(\d+)\s*个\s*SKU(?:[，,]\s*(\d+)\s*件)?/;
  const itOld = /^\s*\d+\s*[\.、]\s*(.+?)\s*[：:]\s*(\d+)\s*件(.*)$/;
  const itNew = /^\s*\d+\s*[\.、]\s*(.+?)\s*\|\s*[A-Z]+-\d+\s*\|\s*(\d+)(?:\s*(\S+))?\s*$/;

  for(const line of lines){
    const wM = line.match(whRe);
    if(wM){
      cur = {code:wM[1].trim(), name:wM[2].trim(), skuCount:+wM[3], itemCount:wM[4]?+wM[4]:0, items:[]};
      m.warehouses.push(cur);
      continue;
    }
    const iO = line.match(itOld);
    if(iO && cur){
      const qty = +iO[2];
      let alert = null;
      const rest = iO[3]||'';
      if(rest.includes('断货') || qty===0) alert = '断货';
      else if(rest.includes('低库存')) alert = '低库存';
      cur.items.push({name:iO[1].trim(), qty, alert});
      continue;
    }
    const iN = line.match(itNew);
    if(iN && cur){
      const qty = +iN[2];
      const mark = iN[3]||'';
      let alert = null;
      if(mark.includes('断货')) alert = '断货';
      else if(mark.includes('低库存')) alert = '低库存';
      else if(qty===0) alert = '断货';
      cur.items.push({name:iN[1].trim(), qty, alert});
    }
  }

  const outB = text.match(/断货预警[：:]\s*(.+)/);
  if(outB) applyAlerts(outB[1], '断货', m);
  const lowB = text.match(/低库存[：:]\s*(.+)/);
  if(lowB) applyAlerts(lowB[1], '低库存', m);

  m.warehouses.forEach(w=>w.items.forEach(i=>{
    if(!i.alert && i.qty===0) i.alert = '断货';
  }));

  m.warehouses.forEach(w=>{
    if(!w.itemCount) w.itemCount = w.items.reduce((s,i)=>s+i.qty,0);
  });
  if(!m.total.skuCount){
    m.total.skuCount = m.warehouses.reduce((s,w)=>s+w.items.length,0);
    m.total.itemCount = m.warehouses.reduce((s,w)=>s+w.itemCount,0);
  }

  /* ---- 成本货值计算 ---- */
  m.total.costValue = 0;
  m.warehouses.forEach(w=>{
    w.costValue = 0;
    w.items.forEach(i=>{
      i.unitPrice = getUnitPrice(i.name);
      i.costValue = i.qty * i.unitPrice;
      w.costValue += i.costValue;
    });
    m.total.costValue += w.costValue;
  });

  return m;
}

function applyAlerts(line, level, model){
  const parts = line.split(/[、,，]/);
  parts.forEach(p=>{
    const m2 = p.trim().match(/^([A-Z]+-\d+)(.+?)(?:\s*(\d+)件)?$/);
    if(!m2) return;
    const whCode = m2[1], itemName = m2[2].trim();
    const wh = model.warehouses.find(w=>w.code===whCode);
    if(!wh) return;
    let item = wh.items.find(i=>i.name===itemName);
    if(!item) item = wh.items.find(i=>i.name.replace(/^\d+件?/,'')===itemName.replace(/^\d+件?/,'') || i.name.startsWith(itemName) || itemName.startsWith(i.name));
    if(item && !item.alert) item.alert = level;
  });
}

const COLORS = ['紫','红','绿','蓝','金','银','黑','白','灰','粉','黄','橙','青','炫彩','银色'];
const BRANDS_PREFIX = ['本田','雅马哈','铃木','川崎'];
const NUM_SUFFIX = /^\d+$/;

function getCategory(name){
  let n = name.trim();
  if(n.startsWith('CLICK')) return 'CLICK' + getCategory(n.slice(5));
  for(const b of BRANDS_PREFIX){ if(n.startsWith(b)){ n = n.slice(b.length); break; } }
  // 先尝试去掉颜色后缀
  for(const c of COLORS){
    if(n.endsWith(c)){
      const core = n.slice(0, n.length - c.length);
      // 去掉尾部数字
      const mNum = core.match(/^(.*?)\d+$/);
      return mNum ? mNum[1] : core;
    }
  }
  // 无颜色后缀时，去掉尾部数字部分
  const mNum = n.match(/^(.*?)(\d+)$/);
  if(mNum) return mNum[1];
  return n;
}

function getUnitPrice(name){
  const n = name.trim();
  if(n.startsWith('CLICK')) return 72;
  if(n.startsWith('风叶盖')){
    if(n.includes('炫彩')) return 33;
    return 29;
  }
  if(n.startsWith('上泵盖')) return 9;
  if(n.startsWith('铆钉')) return 6.5;
  if(n.endsWith('摇臂')) return 9.5;
  if(n.startsWith('脚踏')) return 8.5;
  return 0;
}

function sortItems(items){
  const statusRank = a => a.alert==='断货'?0:(a.alert==='低库存'?1:2);
  return [...items].sort((a,b)=>{
    const s = statusRank(a) - statusRank(b);
    if(s!==0) return s;
    const ca = getCategory(a.name), cb = getCategory(b.name);
    if(ca!==cb) return ca.localeCompare(cb, 'zh');
    return a.qty - b.qty;
  });
}

function renderHead(){
  $('#hd-date').textContent = MODEL.date ? `${MODEL.date} 日报` : '—';
  const now = new Date();
  const t = now.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  $('#hd-update').innerHTML = `<span class="dot" style="background:#6366f1"></span>看板更新 ${t}`;
  $('#hd-sub').textContent = `${MODEL.warehouses.length} 个仓库 · ${MODEL.total.skuCount} 个SKU · ${fmt(MODEL.total.itemCount)} 件`;
}

function renderKPIs(){
  const ws = MODEL.warehouses;
  const allItems = ws.flatMap(w=>w.items.map(i=>({...i,wh:w.name,code:w.code})));
  const outC = allItems.filter(i=>i.alert==='断货').length;
  const lowC = allItems.filter(i=>i.alert==='低库存').length;
  const alertC = outC + lowC;
  const dc = MODEL.total.dailyChange;
  const dcSign = dc===null?'':(dc>0?`+${dc}`:`${dc}`);
  const dcClass = dc===null?'zero':(dc<0?'neg':(dc>0?'pos':'zero'));

  const cards = [
    {lbl:'总SKU数', val:fmt(MODEL.total.skuCount), icon:'🏷️', bg:'var(--primary-soft)',fg:'var(--primary)',
     foot:`<span>分布于 ${ws.length} 个仓库</span>`},
    {lbl:'总库存件数', val:fmt(MODEL.total.itemCount), icon:'📦', bg:'var(--ok-soft)',fg:'#059669',
     foot: dc===null?`<span>无环比数据</span>`:`<span>日环比</span><span class="delta ${dcClass}">${dcSign} 件</span>`},
    {lbl:'仓库数量', val:ws.length, icon:'🏭', bg:'#eff6ff',fg:'#2563eb',
     foot:`<span>${ws.map(w=>w.code).join(' / ')}</span>`},
    {lbl:'预警SKU', val:fmt(alertC), icon:'⚠️', bg: alertC? 'var(--danger-soft)':'var(--ok-soft)',fg: alertC?'#dc2626':'#059669',
     foot:`<span>断货 <b style="color:#dc2626">${outC}</b> · 低库存 <b style="color:#b45309">${lowC}</b></span>`},
    {lbl:'总成本货值', val:'¥'+fmt(Math.round(MODEL.total.costValue||0)), icon:'💰', bg:'#fef3c7',fg:'#d97706',
     foot:`<span>按品类单价估算</span>`}
  ];
  $('#kpis').innerHTML = cards.map(c=>`
    <div class="kpi">
      <div class="ic" style="background:${c.bg};color:${c.fg}">${c.icon}</div>
      <div class="lbl">${c.lbl}</div>
      <div class="val">${c.val}</div>
      <div class="foot">${c.foot}</div>
    </div>`).join('');
}

function renderWhChart(){
  const ws = [...MODEL.warehouses].sort((a,b)=>b.itemCount-a.itemCount);
  const max = Math.max(...ws.map(w=>w.itemCount),1);
  const colors = ['#4f46e5','#7c3aed','#0ea5e9'];
  $('#wh-chart').innerHTML = ws.map((w,i)=>{
    const pct = (w.itemCount/max*100).toFixed(1);
    const alertN = w.items.filter(x=>x.alert).length;
    return `<div class="whbar">
      <div class="top"><span class="nm">${esc(w.code)} ${esc(w.name)}</span>
        <span class="vs">${fmt(w.itemCount)} 件</span></div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${colors[i%colors.length]}">${pct}%</div></div>
      <div class="sub"><span>SKU <b>${w.items.length}</b></span><span>预警 <b style="color:${alertN?'#dc2626':'#6b7280'}">${alertN}</b></span>
        <span>占比 <b>${(w.itemCount/MODEL.total.itemCount*100).toFixed(1)}%</b></span>
        <span>货值 <b style="color:#d97706">¥${fmt(Math.round(w.costValue||0))}</b></span></div>
    </div>`;
  }).join('');
}

function renderHealth(){
  const all = MODEL.warehouses.flatMap(w=>w.items);
  const total = all.length||1;
  const ok = all.filter(i=>!i.alert).length;
  const low = all.filter(i=>i.alert==='低库存').length;
  const out = all.filter(i=>i.alert==='断货').length;
  const okPct=ok/total, lowPct=low/total, outPct=out/total;
  const R=54, C=2*Math.PI*R;
  const seg=(p,color,off)=>{
    const len=C*p;
    return `<circle cx="65" cy="65" r="${R}" fill="none" stroke="${color}" stroke-width="16"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 65 65)"
      style="transition:stroke-dasharray .8s ease"/>`;
  };
  $('#health').innerHTML = `
    <div class="donut">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r="${R}" fill="none" stroke="#f3f4f6" stroke-width="16"/>
        ${seg(outPct,'#ef4444',0)}
        ${seg(lowPct,'#f59e0b',outPct*C)}
        ${seg(okPct,'#10b981',(outPct+lowPct)*C)}
      </svg>
      <div class="center"><div class="n">${fmt(total)}</div><div class="t">SKU 总数</div></div>
    </div>
    <div class="legend">
      <div class="row"><div class="l"><span class="sq" style="background:#10b981"></span>正常</div><div><span class="num">${ok}</span> · ${(okPct*100).toFixed(0)}%</div></div>
      <div class="row"><div class="l"><span class="sq" style="background:#f59e0b"></span>低库存</div><div><span class="num">${low}</span> · ${(lowPct*100).toFixed(0)}%</div></div>
      <div class="row"><div class="l"><span class="sq" style="background:#ef4444"></span>断货</div><div><span class="num">${out}</span> · ${(outPct*100).toFixed(0)}%</div></div>
    </div>`;
}

function renderAlerts(){
  const outs=[], lows=[];
  MODEL.warehouses.forEach(w=>w.items.forEach(i=>{
    if(i.alert==='断货') outs.push({...i,wh:w.name,code:w.code});
    else if(i.alert==='低库存') lows.push({...i,wh:w.name,code:w.code});
  }));
  const box=(items,cls,title)=>`<div class="alert-box ${cls}">
    <div class="ht">${title}<span class="cnt">${items.length}</span></div>
    ${items.length?`<div class="alert-list">${items.map(i=>`
      <div class="alert-item"><span>${esc(i.name)}<span class="wn"> · ${esc(i.code)} ${esc(i.wh)}</span></span>
        <span class="qn" style="color:${cls==='out'?'#dc2626':'#b45309'}">${i.qty}件</span></div>`).join('')}</div>`
      :`<div class="empty-note">暂无</div>`}
  </div>`;
  $('#alerts').innerHTML = box(outs.sort((a,b)=>a.qty-b.qty),'out','🔴 断货 SKU')+box(lows.sort((a,b)=>a.qty-b.qty),'low','🟡 低库存 SKU');
}

function renderTables(){
  const q = $('#search').value.trim().toLowerCase();
  const colors = ['#4f46e5','#0ea5e9','#7c3aed'];
  const maxQty = Math.max(...MODEL.warehouses.flatMap(w=>w.items.map(i=>i.qty)),1);
  $('#wh-tables').innerHTML = MODEL.warehouses.map((w,wi)=>{
    let items = sortItems(w.items);
    if(q) items = items.filter(i=>i.name.toLowerCase().includes(q));
    if(activeFilter==='out') items = items.filter(i=>i.alert==='断货');
    else if(activeFilter==='low') items = items.filter(i=>i.alert==='低库存');
    else if(activeFilter==='ok') items = items.filter(i=>!i.alert);
    const alertN = w.items.filter(x=>x.alert).length;
    const rows = items.length? items.map(i=>{
      const cls = i.alert==='断货'?'out':(i.alert==='低库存'?'low':'ok');
      const lbl = i.alert==='断货'?'断货':(i.alert==='低库存'?'低库存':'正常');
      const barColor = i.alert==='断货'?'#ef4444':(i.alert==='低库存'?'#f59e0b':'#10b981');
      return `<tr>
        <td><span class="bar-mini"><i style="width:${i.qty/maxQty*100}%;background:${barColor}"></i></span>${esc(i.name)}</td>
        <td class="num">${fmt(i.qty)}</td>
        <td><span class="badge ${cls}">${lbl}</span></td>
      </tr>`;
    }).join('') : `<tr><td colspan="3" class="nores">无匹配SKU</td></tr>`;
    return `<div class="wh-card" style="margin-bottom:14px">
      <div class="wh-head">
        <div class="lt"><span class="code" style="background:${colors[wi%colors.length]}1a;color:${colors[wi%colors.length]}">${esc(w.code)}</span>
          <span class="nm">${esc(w.name)}</span></div>
        <div class="rt">SKU <b>${w.items.length}</b> · 库存 <b>${fmt(w.items.reduce((s,i)=>s+i.qty,0))}</b>件 · 货值 <b style="color:#d97706">¥${fmt(Math.round(w.costValue||0))}</b> · 预警 <b style="color:${alertN?'#dc2626':'inherit'}">${alertN}</b></div>
      </div>
      <div class="tbl-wrap">
        <table><thead><tr><th>SKU名称</th><th class="num">库存</th><th>状态</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
      ${renderWhCategorySummary(items)}
    </div>`;
  }).join('');
}

function renderMatrix(){
  const map = new Map();
  MODEL.warehouses.forEach(w=>w.items.forEach(i=>{
    if(!map.has(i.name)) map.set(i.name,{name:i.name,total:0,whs:[],alerts:new Set()});
    const e = map.get(i.name);
    e.total += i.qty;
    e.whs.push({code:w.code,name:w.name,qty:i.qty});
    if(i.alert) e.alerts.add(i.alert);
  }));
  const rows = [...map.values()].sort((a,b)=>b.total-a.total);
  const q = $('#search').value.trim().toLowerCase();
  const filt = q? rows.filter(r=>r.name.toLowerCase().includes(q)) : rows;
  const body = filt.length? filt.map(r=>{
    const worst = r.alerts.has('断货')?'断货':(r.alerts.has('低库存')?'低库存':'正常');
    const cls = worst==='断货'?'out':(worst==='低库存'?'low':'ok');
    return `<tr>
      <td>${esc(r.name)}</td>
      <td class="num">${fmt(r.total)}</td>
      <td class="num">${r.whs.length}</td>
      <td>${r.whs.map(x=>`<span style="font-size:11.5px;background:#f3f4f6;padding:2px 7px;border-radius:5px;margin-right:4px">${esc(x.code)} ${fmt(x.qty)}</span>`).join('')}</td>
      <td><span class="badge ${cls}">${worst}</span></td>
    </tr>`;
  }).join('') : `<tr><td colspan="5" class="nores">无匹配SKU</td></tr>`;
  $('#matrix').querySelector('tbody').innerHTML = body;
}

function renderChips(){
  const all = MODEL.warehouses.flatMap(w=>w.items);
  const out = all.filter(i=>i.alert==='断货').length;
  const low = all.filter(i=>i.alert==='低库存').length;
  const ok = all.length-out-low;
  const chips=[['全部',all.length,'all'],['断货',out,'out'],['低库存',low,'low'],['正常',ok,'ok']];
  $('#chips').innerHTML = chips.map(c=>`<span class="chip ${activeFilter===c[2]?'active':''}" data-f="${c[2]}">${c[0]} (${c[1]})</span>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
    activeFilter = el.dataset.f;
    renderChips();renderTables();renderCatMatrix();
  });
}

/* ============ 类目汇总 ============ */
function buildCategoryMap(items){
  const m = new Map();
  items.forEach(i=>{
    const cat = getCategory(i.name);
    if(!m.has(cat)) m.set(cat,{name:cat,total:0,count:0,costValue:0,alerts:new Set()});
    const e = m.get(cat);
    e.total += i.qty;
    e.count += 1;
    e.costValue += (i.costValue || i.qty * (i.unitPrice || getUnitPrice(i.name)));
    if(i.alert) e.alerts.add(i.alert);
  });
  return m;
}

function categoryWorst(alerts){
  if(alerts.has('断货')) return {label:'断货',cls:'out'};
  if(alerts.has('低库存')) return {label:'低库存',cls:'low'};
  return {label:'正常',cls:'ok'};
}

function renderWhCategorySummary(items){
  const map = buildCategoryMap(items);
  const arr = [...map.values()].sort((a,b)=>b.total-a.total);
  if(!arr.length) return `<div class="cat-summary"><span class="cat-empty">暂无匹配类目</span></div>`;
  const pills = arr.map(c=>{
    const w = categoryWorst(c.alerts);
    const totalText = c.total===0 ? '断货' : `${fmt(c.total)}件`;
    const costText = c.costValue ? `¥${fmt(Math.round(c.costValue))}` : '';
    return `<span class="ci ${w.cls==='out'?'out':(w.cls==='low'?'low':'')}">
      <b>${esc(c.name)}</b> ${totalText}<em>(${c.count}个)</em>${costText?`<em style="color:#d97706;margin-left:4px">${costText}</em>`:''}
    </span>`;
  }).join('');
  return `<div class="cat-summary"><span class="ctit">📊 类目汇总</span>${pills}</div>`;
}

function renderCatMatrix(){
  const ws = MODEL.warehouses;
  const q = $('#search').value.trim().toLowerCase();

  // Build per-warehouse category maps
  const whMaps = ws.map(w=>buildCategoryMap(w.items));

  // Collect all categories
  const allCats = new Set();
  whMaps.forEach(m=>{ for(const k of m.keys()) allCats.add(k); });

  // Filter by search: include category if any SKU in it matches the query
  let catNames = [...allCats];
  if(q){
    catNames = catNames.filter(cat=>{
      // Check if any SKU in this category (across any warehouse) matches the search
      for(let wi=0; wi<ws.length; wi++){
        const catData = whMaps[wi].get(cat);
        if(!catData) continue;
        // Need to check actual item names - let's find items in this category
        const matching = ws[wi].items.filter(it=>getCategory(it.name)===cat && it.name.toLowerCase().includes(q));
        if(matching.length) return true;
      }
      return false;
    });
  }

  // Also apply status filter
  if(activeFilter!=='all'){
    catNames = catNames.filter(cat=>{
      let hasMatch = false;
      for(let wi=0; wi<ws.length; wi++){
        const cd = whMaps[wi].get(cat);
        if(!cd) continue;
        if(activeFilter==='out' && cd.alerts.has('断货')) return true;
        if(activeFilter==='low' && cd.alerts.has('低库存')) return true;
        if(activeFilter==='ok' && cd.alerts.size===0) { hasMatch = true; }
      }
      return activeFilter==='ok' ? hasMatch : false;
    });
  }

  // Build full category objects with per-warehouse data
  const rows = catNames.map(cat=>{
    const r = {name:cat,total:0,count:0,alerts:new Set(),whData:[]};
    ws.forEach((w,wi)=>{
      const cd = whMaps[wi].get(cat);
      if(cd){
        r.total += cd.total;
        r.count += cd.count;
        cd.alerts.forEach(a=>r.alerts.add(a));
        r.whData.push({total:cd.total,count:cd.count,costValue:cd.costValue||0,alerts:cd.alerts});
      } else {
        r.whData.push(null);
      }
    });
    return r;
  }).sort((a,b)=>b.total-a.total);

  // Set header texts
  ws.forEach((w,i)=>{
    const el = document.getElementById(`cat-th-${i}`);
    if(el) el.textContent = w.code;
  });
  $('#cat-total').textContent = rows.length;

  const tbody = rows.length? rows.map(r=>{
    const w = categoryWorst(r.alerts);
    const whCells = r.whData.map((d,wi)=>{
      if(!d) return `<td class="cat-wh-cell" style="color:var(--muted)">—</td>`;
      const dw = categoryWorst(d.alerts);
      const spanCls = dw.cls==='out'?'ot':(dw.cls==='low'?'lo':'');
      let extra = '';
      if(d.alerts.has('低库存')) {
        // count low-stock skus in this wh cat
        const lowN = ws[wi].items.filter(it=>getCategory(it.name)===r.name && it.alert==='低库存').length;
        extra = `<span class="lo">(${lowN}件低)</span>`;
      } else if(d.alerts.has('断货')){
        const outN = ws[wi].items.filter(it=>getCategory(it.name)===r.name && it.alert==='断货').length;
        extra = `<span class="ot">(${outN}件断)</span>`;
      }
      return `<td class="cat-wh-cell"><span class="${spanCls}">${fmt(d.total)}</span>${extra}<div class="cat-sub">${d.count}个SKU</div></td>`;
    }).join('');
    const totalCost = r.whData.reduce((s,d)=>s+(d?d.costValue||0:0),0);
    return `<tr class="cat-matrix-row">
      <td><b>${esc(r.name)}</b></td>
      <td class="num"><b>${fmt(r.total)}</b></td>
      <td class="num">${r.count}</td>
      ${whCells}
      <td class="num" style="color:#d97706;font-weight:700">¥${fmt(Math.round(totalCost))}</td>
      <td><span class="badge ${w.cls}">${w.label}</span></td>
    </tr>`;
  }).join('') : `<tr><td colspan="${3+ws.length+2}" class="nores">无匹配类目</td></tr>`;

  $('#cat-matrix').querySelector('tbody').innerHTML = tbody;
}

function renderAll(){
  renderHead();renderKPIs();renderWhChart();renderHealth();
  renderAlerts();renderChips();renderTables();renderMatrix();renderCatMatrix();
}

$('#search').addEventListener('input',()=>{renderTables();renderMatrix();renderCatMatrix();});
$('#btn-update').onclick = ()=>{
  const txt = $('#raw-input').value.trim();
  if(!txt){setStatus('请先粘贴日报文本','err');return;}
  try{
    const m = parseInput(txt);
    if(!m.warehouses.length){setStatus('未识别到仓库数据，请检查格式','err');return;}
    MODEL = m; activeFilter='all'; $('#search').value='';
    renderAll();setStatus('✓ 已更新看板','ok');toast('看板已更新');
  }catch(e){setStatus('解析失败：'+e.message,'err');}
};
$('#btn-load').onclick = ()=>{ $('#raw-input').value = SAMPLE_DATA; setStatus('已载入示例数据','ok'); };
$('#btn-export').onclick = ()=>{
  const blob = new Blob([JSON.stringify(MODEL,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `库存日报_${MODEL.date||'export'}.json`;
  a.click();URL.revokeObjectURL(a.href);toast('已导出JSON');
};
$('#dp-toggle').onclick = ()=> $('#data-panel').classList.toggle('open');
function setStatus(msg,type){const e=$('#dp-status');e.textContent=msg;e.className='dp-status '+(type||'');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

renderAll();
